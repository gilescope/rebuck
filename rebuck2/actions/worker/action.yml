name: rebuck2 worker
description: >-
  A whole worker job: install the engine, restore its slice of the bank,
  serve until the driver disconnects, then bank what it authored. There
  is nothing consumer-specific in a worker - only the fleet position -
  so this is the entire job bar `actions/checkout`.

  Needs a rust toolchain on PATH for the engine's cache-miss cargo
  install. Put `continue-on-error: true` on the job: a lost worker must
  not redden the run, the driver job is the verdict.

inputs:
  session:
    description: Mesh session id - must match the driver's.
    required: true
  role:
    description: >-
      This node's identity in the bank. Names the AC manifest it writes
      and its spill artifact; must be stable across laps for its history
      to accumulate. Defaults to <os>-<job index>.
    default: ""
  shard:
    description: >-
      CAS range this worker is PRIMARY manifest writer for (0-7), or empty
      for spill-only. One writer per range IS the work split.
    default: ""
  rebuck2-git:
    description: Git URL of the rebuck repo to install the engine from.
    default: https://github.com/gilescope/rebuck
  rebuck2-rev:
    description: >-
      Engine commit to install. Empty = the ref this action was pinned at
      (github.action_ref) - pin the action by full sha for that to work.
      Set to "skip" if rebuck2 is already on PATH.
    default: ""
  store:
    description: >-
      Store root (worker store = <root>/worker). Empty = $DEV_DRIVE/rebuck2
      when a Dev Drive is mounted, else ~/.cache/rebuck2.
    default: ""
  lineage:
    description: 'Bank lineage. Defaults to the branch (PR: the source branch).'
    default: ""
  parent-lineage:
    description: Trunk to inherit from. Defaults to the PR base branch.
    default: ""
  slots:
    description: Exec slots. Empty = engine default (nproc).
    default: ""
  addr-artifact:
    description: Run-artifact name the driver address is published under.
    default: "driver-addr"
  addr-run-id:
    description: >-
      Run id that published the addr artifact. Defaults to this run - set
      it when workers are summoned by an autoscaler into their own run
      while the driver lives in the triggering one.
    default: ${{ github.run_id }}
  addr-poll-secs:
    description: >-
      How long to poll for the address artifact (driver runner allocation
      can tail past 30 min). n0 discovery remains the fallback.
    default: "2400"
  serve-timeout-secs:
    description: Hard cap on the serve step (guards a driver that never shows).
    default: "20400"
  connect-wait-secs:
    description: --connect-wait-secs passed to the worker.
    default: "1800"
  extra-args:
    description: Extra raw flags appended to `rebuck2 worker`.
    default: ""
  github-token:
    description: Token for artifact fetches (needs actions:read).
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Resolve rebuck2 rev
      id: rev
      if: inputs.rebuck2-rev != 'skip'
      shell: bash
      env:
        IN_GIT: ${{ inputs.rebuck2-git }}
        IN_REV: ${{ inputs.rebuck2-rev }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        REV=$(bash "$GITHUB_ACTION_PATH/../resolve-rev.sh" "$IN_GIT" "$IN_REV" "" "$ACTION_REF")
        echo "rev=$REV" >> "$GITHUB_OUTPUT"
        echo "key=$(bash "$GITHUB_ACTION_PATH/../crate-key.sh" "$IN_GIT" "$REV")" >> "$GITHUB_OUTPUT"

    - name: Cache rebuck2 binary (keyed by crate source)
      id: bin
      if: inputs.rebuck2-rev != 'skip'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/rebuck2
          ~/.cargo/bin/rebuck2.exe
        key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rev.outputs.key }}

    - name: Install rebuck2 (cache miss only)
      if: inputs.rebuck2-rev != 'skip' && steps.bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        IN_GIT: ${{ inputs.rebuck2-git }}
        REV: ${{ steps.rev.outputs.rev }}
      run: cargo install --locked --git "$IN_GIT" --rev "$REV" rebuck2

    # Everything the bank needs, resolved once: the store root per OS, the
    # role, and the staging dir. A caller states its fleet POSITION; where
    # any of it lives is this action's business.
    - name: Restore this worker's slice of the bank
      id: bank
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IN_STORE: ${{ inputs.store }}
        IN_ROLE: ${{ inputs.role }}
        IN_SHARD: ${{ inputs.shard }}
        CAS_LINEAGE: ${{ inputs.lineage || github.head_ref || github.ref_name }}
        CAS_PARENT_LINEAGE: ${{ inputs.parent-lineage || github.base_ref }}
      run: |
        set -euo pipefail
        WORK="$RUNNER_TEMP/rebuck2-worker"
        mkdir -p "$WORK"
        STORE="$IN_STORE"
        if [ -z "$STORE" ]; then
          if [ -n "${DEV_DRIVE:-}" ]; then STORE="$DEV_DRIVE/rebuck2"
          else STORE="$HOME/.cache/rebuck2"; fi
        fi
        ROLE="${IN_ROLE:-$RUNNER_OS-$GITHUB_JOB}"
        {
          echo "REBUCK2_WORK=$WORK"
          echo "REBUCK2_STORE=$STORE"
          echo "REBUCK2_ROLE=$ROLE"
        } >> "$GITHUB_ENV"
        export BANK_WORK="$WORK/bank-$ROLE"

        # One call: CAS range (or blob-list only), this role's AC history,
        # parent-lineage inheritance, spill absorption when it owns a
        # range, and hash verification of everything that arrived. 3 = a
        # cold bank, which is a normal first lap on a new lineage.
        rc=0
        rebuck2 bank restore "$STORE/worker" "$ROLE" own "${IN_SHARD:--}" \
          "$CAS_LINEAGE" "${CAS_PARENT_LINEAGE:--}" || rc=$?
        if [ "$rc" -eq 3 ]; then echo "cold=1" >> "$GITHUB_OUTPUT"
        elif [ "$rc" -ne 0 ]; then exit "$rc"; fi

    - name: Serve until the driver disconnects
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IN_SESSION: ${{ inputs.session }}
        IN_SLOTS: ${{ inputs.slots }}
        IN_TIMEOUT: ${{ inputs.serve-timeout-secs }}
        IN_CONNECT_WAIT: ${{ inputs.connect-wait-secs }}
        IN_EXTRA: ${{ inputs.extra-args }}
        IN_ADDR_NAME: ${{ inputs.addr-artifact }}
        IN_ADDR_RUN: ${{ inputs.addr-run-id }}
        IN_POLL: ${{ inputs.addr-poll-secs }}
      run: |
        set -euo pipefail
        cd "$REBUCK2_WORK"
        # The lap-finished marker is checked in BOTH waiting rooms. A
        # worker that arrives after the driver has gone otherwise burns
        # its whole connect budget dialling a corpse and reds its job
        # doing it (run 30517451940: 1h34m).
        over=0
        for i in $(seq 1 $((IN_POLL / 10))); do
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_ADDR_RUN/artifacts" \
               --jq ".artifacts[] | select(.name==\"$IN_ADDR_NAME\") | .id" 2>/dev/null | head -1 > aid.txt \
             && [ -s aid.txt ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(cat aid.txt)/zip" > addr.zip 2>/dev/null \
              && unzip -o addr.zip > /dev/null && [ -s driver-addr.json ] && break
          fi
          if [ $((i % 6)) -eq 0 ] \
             && gh cache list -R "$GITHUB_REPOSITORY" \
                  -k "rebuck2-done-$IN_ADDR_RUN" --json key -q '.[].key' | grep -q .; then
            echo "[worker] lap finished while waiting for the driver - nothing to join"
            over=1; break
          fi
          sleep 10
        done
        if [ "$over" = "1" ]; then exit 0; fi

        FLAGS=(--session "$IN_SESSION"
               --connect-wait-secs "$IN_CONNECT_WAIT"
               --give-up-file "$REBUCK2_WORK/party-over"
               --store "$REBUCK2_STORE/worker")
        [ -s driver-addr.json ] && FLAGS+=(--driver-addr-file "$REBUCK2_WORK/driver-addr.json")
        [ -n "$IN_SLOTS" ] && FLAGS+=(--slots "$IN_SLOTS")
        # shellcheck disable=SC2206 # extra-args intentionally word-splits
        [ -n "$IN_EXTRA" ] && FLAGS+=($IN_EXTRA)
        ( until gh cache list -R "$GITHUB_REPOSITORY" \
                  -k "rebuck2-done-$IN_ADDR_RUN" --json key -q '.[].key' | grep -q .; do
            sleep 60; done
          : > "$REBUCK2_WORK/party-over" ) &
        # macOS ships GNU timeout as gtimeout (coreutils).
        T=(); command -v timeout >/dev/null && T=(timeout "$IN_TIMEOUT")
        [ ${#T[@]} -eq 0 ] && command -v gtimeout >/dev/null && T=(gtimeout "$IN_TIMEOUT")
        "${T[@]}" rebuck2 worker "${FLAGS[@]}" | tee "$REBUCK2_WORK/worker.log"

    # Row and blobs were authored on this box in this lap and are banked
    # by it in this teardown: a torn publish loses both together (an
    # honest miss) instead of banking a row whose outputs never landed.
    - name: Bank what this worker authored
      id: pack
      if: always()
      shell: bash
      env:
        CAS_LINEAGE: ${{ inputs.lineage || github.head_ref || github.ref_name }}
        CAS_PARENT_LINEAGE: ${{ inputs.parent-lineage || github.base_ref }}
        IN_SHARD: ${{ inputs.shard }}
      run: |
        set -euo pipefail
        export BANK_WORK="$REBUCK2_WORK/bank-$REBUCK2_ROLE"
        rebuck2 bank publish "$REBUCK2_STORE/worker" "$REBUCK2_ROLE" \
          "${IN_SHARD:--}" "$CAS_LINEAGE" "$GITHUB_RUN_ID" \
          "${CAS_PARENT_LINEAGE:--}"

    # Self-verification is step ORDER: each manifest upload is gated on
    # its container landing, so a manifest can never reference a container
    # that did not.
    - id: cas-container
      if: always() && steps.pack.outputs.have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-segs-${{ inputs.lineage || github.head_ref || github.ref_name }}-${{ github.run_id }}-${{ env.REBUCK2_ROLE }}
        path: ${{ runner.temp }}/rebuck2-worker/bank-${{ env.REBUCK2_ROLE }}/bank-container
        compression-level: 0

    - if: always() && steps.pack.outputs.manifest == '1' && steps.cas-container.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ inputs.lineage || github.head_ref || github.ref_name }}-r${{ inputs.shard }}
        path: ${{ runner.temp }}/rebuck2-worker/bank-${{ env.REBUCK2_ROLE }}/bank-manifest-out

    - if: always() && steps.pack.outputs.spill == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-spill-${{ inputs.lineage || github.head_ref || github.ref_name }}-${{ github.run_id }}-${{ env.REBUCK2_ROLE }}
        path: ${{ runner.temp }}/rebuck2-worker/bank-${{ env.REBUCK2_ROLE }}/bank-spill
        compression-level: 0

    - id: ac-container
      if: always() && steps.pack.outputs.ac-have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-ac-segs-${{ inputs.lineage || github.head_ref || github.ref_name }}-${{ github.run_id }}-${{ env.REBUCK2_ROLE }}
        path: ${{ runner.temp }}/rebuck2-worker/bank-${{ env.REBUCK2_ROLE }}/ac-container
        compression-level: 0

    - if: always() && steps.pack.outputs.ac-have == '1' && steps.ac-container.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ inputs.lineage || github.head_ref || github.ref_name }}-ac-${{ env.REBUCK2_ROLE }}
        path: ${{ runner.temp }}/rebuck2-worker/bank-${{ env.REBUCK2_ROLE }}/ac-manifest-out
