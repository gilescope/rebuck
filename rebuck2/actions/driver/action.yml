name: rebuck2 driver
description: >-
  A whole driver job bar the build itself: install buck2 and the engine,
  restore the bank, start the driver (and a co-worker on the same box),
  publish its address for the fleet, wait for quorum, and point buck2 at
  it. Pair with `driver-finish` after your build step.

inputs:
  session:
    description: Mesh session id - workers must pass the same one.
    required: true
  buck2-version:
    description: Pinned buck2 release to install. Empty = skip (already on PATH).
    default: ""
  rebuck2-git:
    description: Git URL of the rebuck repo to install the engine from.
    default: https://github.com/gilescope/rebuck
  rebuck2-rev:
    description: >-
      Engine commit to install. Empty = the ref this action was pinned at
      (github.action_ref). "skip" if rebuck2 is already on PATH.
    default: ""
  store:
    description: >-
      Store root. The driver uses <root>/driver and its co-worker
      <root>/co-worker. Empty = $DEV_DRIVE/rebuck2 when a Dev Drive is
      mounted, else ~/.cache/rebuck2.
    default: ""
  lineage:
    description: 'Bank lineage. Defaults to the branch (PR: the source branch).'
    default: ""
  parent-lineage:
    description: >-
      Trunk to inherit from, read-only: its content seeds this store and
      joins the diff base, while every publish still goes to this
      lineage's own manifest. Defaults to the PR base branch.
    default: ""
  grpc-port:
    description: Local port buck2 talks REAPI to.
    default: "9092"
  min-workers:
    description: Workers to wait for before releasing the build.
    default: "1"
  co-worker-slots:
    description: >-
      Exec slots for a worker on the driver box ("half" = nproc/2, "0" =
      none). It authors AC rows like any other node, so it banks under
      its own role.
    default: "0"
  no-local-exec:
    description: Refuse to execute locally - the fleet does the work.
    default: "false"
  cache-failures:
    description: >-
      Cache failing actions WITHIN the lap. They are purged before they
      can be banked: a banked environmental failure replays forever.
    default: "false"
  extra-args:
    description: Extra raw flags appended to `rebuck2 driver`.
    default: ""
  addr-artifact:
    description: Run-artifact name to publish the driver address under.
    default: "driver-addr"
  addr-wait-secs:
    description: How long to wait for the driver to write its address.
    default: "120"
  quorum-wait-secs:
    description: >-
      How long to wait for worker quorum. A rebuck2 rev bump makes every
      worker cold-compile the binary (~10-15 min) before it can join.
    default: "2700"
  write-buckconfig:
    description: Write .buckconfig.local pointing buck2 at the driver.
    default: "true"
  execution-platforms:
    description: >-
      Target for [build].execution_platforms (e.g. root//platforms:re-exec).
      Empty = section omitted (you manage platforms yourself).
    default: ""
  buckconfig-extra:
    description: Extra .buckconfig.local sections, appended verbatim.
    default: ""
  buck-root:
    description: Directory holding .buckconfig (where .buckconfig.local goes).
    default: "."

outputs:
  addr-file:
    description: Path of the driver address file (also published as artifact).
    value: ${{ steps.paths.outputs.addr-file }}

runs:
  using: composite
  steps:
    - name: Install buck2 (pinned)
      if: inputs.buck2-version != ''
      shell: bash
      env:
        IN_VERSION: ${{ inputs.buck2-version }}
        PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/../install-buck2.sh" "$IN_VERSION" "$PLATFORM"


    - name: Resolve rebuck2 rev
      id: rev
      if: inputs.rebuck2-rev != 'skip'
      shell: bash
      env:
        IN_GIT: ${{ inputs.rebuck2-git }}
        IN_REV: ${{ inputs.rebuck2-rev }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        REV=$(bash "$GITHUB_ACTION_PATH/../resolve-rev.sh" "$IN_GIT" "$IN_REV" "" "$ACTION_REF")
        echo "rev=$REV" >> "$GITHUB_OUTPUT"
        echo "key=$(bash "$GITHUB_ACTION_PATH/../crate-key.sh" "$IN_GIT" "$REV")" >> "$GITHUB_OUTPUT"


    - name: Cache rebuck2 binary (keyed by crate source)
      id: bin
      if: inputs.rebuck2-rev != 'skip'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/rebuck2
          ~/.cargo/bin/rebuck2.exe
        key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rev.outputs.key }}


    - name: Install rebuck2 (cache miss only)
      if: inputs.rebuck2-rev != 'skip' && steps.bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        IN_GIT: ${{ inputs.rebuck2-git }}
        REV: ${{ steps.rev.outputs.rev }}
      run: cargo install --locked --git "$IN_GIT" --rev "$REV" rebuck2


    - name: Resolve paths and restore the bank
      id: paths
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IN_STORE: ${{ inputs.store }}
        IN_SLOTS: ${{ inputs.co-worker-slots }}
        CAS_LINEAGE: ${{ inputs.lineage || github.head_ref || github.ref_name }}
        CAS_PARENT_LINEAGE: ${{ inputs.parent-lineage || github.base_ref }}
      run: |
        set -euo pipefail
        WORK="$RUNNER_TEMP/rebuck2-driver"
        mkdir -p "$WORK"
        STORE="$IN_STORE"
        if [ -z "$STORE" ]; then
          if [ -n "${DEV_DRIVE:-}" ]; then STORE="$DEV_DRIVE/rebuck2"
          else STORE="$HOME/.cache/rebuck2"; fi
        fi
        {
          echo "REBUCK2_WORK=$WORK"
          echo "REBUCK2_STORE=$STORE"
          echo "REBUCK2_DRIVER_LOG=$WORK/driver.log"
          echo "REBUCK2_COWORKER_LOG=$WORK/co-worker.log"
          echo "REBUCK2_DRIVER_PID_FILE=$WORK/driver.pid"
          echo "REBUCK2_LINEAGE=$CAS_LINEAGE"
          echo "REBUCK2_PARENT_LINEAGE=${CAS_PARENT_LINEAGE:--}"
        } >> "$GITHUB_ENV"
        echo "addr-file=$WORK/driver-addr.json" >> "$GITHUB_OUTPUT"

        # The driver is the only node that READS the action cache, so it
        # lays down every role's rows - and the parent lineage's beneath
        # them. It owns no CAS range: shard '-' fetches the blob-list
        # union it needs to diff its spill against, and seeds nothing.
        rc=0
        BANK_WORK="$WORK/bank-driver" \
          rebuck2 bank restore "$STORE/driver" driver all - \
            "$CAS_LINEAGE" "${CAS_PARENT_LINEAGE:--}" || rc=$?
        [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || exit "$rc"

        # The co-worker executes actions too, so it authors rows and needs
        # its own history to re-pack from - and its own staging dir, or
        # its restore would overwrite the driver's manifest head.
        if [ "$IN_SLOTS" != "0" ] && [ -n "$IN_SLOTS" ]; then
          rc=0
          BANK_WORK="$WORK/bank-co-worker" \
            rebuck2 bank restore "$STORE/co-worker" co-worker own - \
              "$CAS_LINEAGE" "${CAS_PARENT_LINEAGE:--}" --no-verify || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || exit "$rc"
        fi

    - name: Start driver (+ co-worker)
      shell: bash
      env:
        IN_SESSION: ${{ inputs.session }}
        IN_PORT: ${{ inputs.grpc-port }}
        IN_MIN_WORKERS: ${{ inputs.min-workers }}
        IN_SLOTS: ${{ inputs.co-worker-slots }}
        IN_NO_LOCAL_EXEC: ${{ inputs.no-local-exec }}
        IN_CACHE_FAILURES: ${{ inputs.cache-failures }}
        IN_EXTRA: ${{ inputs.extra-args }}
        IN_ADDR_WAIT: ${{ inputs.addr-wait-secs }}
      run: |
        FLAGS=(--grpc-port "$IN_PORT" --min-workers "$IN_MIN_WORKERS"
               --session "$IN_SESSION"
               --addr-file "$REBUCK2_WORK/driver-addr.json"
               --store "$REBUCK2_STORE/driver")
        [ "$IN_NO_LOCAL_EXEC" = "true" ] && FLAGS+=(--no-local-exec)
        [ "$IN_CACHE_FAILURES" = "true" ] && FLAGS+=(--cache-failures)
        # shellcheck disable=SC2206 # extra-args intentionally word-splits
        [ -n "$IN_EXTRA" ] && FLAGS+=($IN_EXTRA)
        rebuck2 driver "${FLAGS[@]}" > "$REBUCK2_DRIVER_LOG" 2>&1 &
        echo $! > "$REBUCK2_DRIVER_PID_FILE"
        if [ "$IN_SLOTS" != "0" ] && [ -n "$IN_SLOTS" ]; then
          SLOTS="$IN_SLOTS"
          [ "$SLOTS" = "half" ] && SLOTS=$(($(nproc) / 2))
          rebuck2 worker --session "$IN_SESSION" --slots "$SLOTS" \
            --store "$REBUCK2_STORE/co-worker" > "$REBUCK2_COWORKER_LOG" 2>&1 &
          echo "REBUCK2_COWORKER=1" >> "$GITHUB_ENV"
        fi
        for _ in $(seq 1 $((IN_ADDR_WAIT / 2))); do
          [ -s "$REBUCK2_WORK/driver-addr.json" ] && exit 0
          sleep 2
        done
        cat "$REBUCK2_DRIVER_LOG"; echo "driver never wrote its addr"; exit 1

    # Workers fetch this and dial the relay directly - no n0 discovery
    # dependency (a regional discovery outage once cost two runs).

    - name: Publish driver addr
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.addr-artifact }}
        path: ${{ runner.temp }}/rebuck2-driver/driver-addr.json


    - name: Wait for worker quorum
      shell: bash
      env:
        IN_MIN_WORKERS: ${{ inputs.min-workers }}
        IN_QUORUM_WAIT: ${{ inputs.quorum-wait-secs }}
      run: |
        for _ in $(seq 1 $((IN_QUORUM_WAIT / 5))); do
          joined=$(grep -c " joined: " "$REBUCK2_DRIVER_LOG" || true)
          [ "$joined" -ge "$IN_MIN_WORKERS" ] && { grep " joined: " "$REBUCK2_DRIVER_LOG"; exit 0; }
          kill -0 "$(cat "$REBUCK2_DRIVER_PID_FILE")" || { cat "$REBUCK2_DRIVER_LOG"; echo "driver died"; exit 1; }
          sleep 5
        done
        cat "$REBUCK2_DRIVER_LOG"; echo "quorum never formed"; exit 1


    - name: Point buck2 at rebuck2
      if: inputs.write-buckconfig == 'true'
      shell: bash
      env:
        IN_PORT: ${{ inputs.grpc-port }}
        IN_PLATFORMS: ${{ inputs.execution-platforms }}
        IN_EXTRA_CFG: ${{ inputs.buckconfig-extra }}
        IN_BUCK_ROOT: ${{ inputs.buck-root }}
      run: |
        {
          if [ -n "$IN_PLATFORMS" ]; then
            echo "[build]"
            echo "execution_platforms = $IN_PLATFORMS"
            echo
          fi
          if [ -n "$IN_EXTRA_CFG" ]; then
            echo "$IN_EXTRA_CFG"
            echo
          fi
          echo "[buck2_re_client]"
          echo "action_cache_address = grpc://127.0.0.1:$IN_PORT"
          echo "cas_address = grpc://127.0.0.1:$IN_PORT"
          echo "engine_address = grpc://127.0.0.1:$IN_PORT"
          echo "tls = false"
        } > "$IN_BUCK_ROOT/.buckconfig.local"
        cat "$IN_BUCK_ROOT/.buckconfig.local"
