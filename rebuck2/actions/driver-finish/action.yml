name: rebuck2 driver finish
description: >-
  Close the lap: stop the driver so the fleet packs in parallel, tell any
  worker still dialling that the party is over, bank what this box
  authored, and collect the logs. Pair with `driver` around your build.

inputs:
  log-artifact:
    description: Artifact name for the driver + co-worker logs.
    default: "rebuck2-logs"

runs:
  using: composite
  steps:
    # Stopping first is deliberate: it broadcasts exit to the fleet, so
    # every worker starts its own pack while this box does the same. The
    # driver's teardown is then off the critical path.
    - name: Stop the driver
      if: always()
      shell: bash
      run: |
        kill "$(cat "$REBUCK2_DRIVER_PID_FILE")" 2>/dev/null || true
        for _ in $(seq 1 24); do
          pgrep -f "rebuck2 worker" > /dev/null 2>&1 || break
          sleep 5
        done

    # A 0-byte marker keyed to this run. A worker that arrives after the
    # driver has gone reads it and exits clean, instead of burning its
    # whole connect budget dialling a corpse (run 30517451940: 1h34m).
    # always(): a FAILED driver ends the party too.
    - name: Mark the lap finished
      if: always()
      shell: bash
      run: |
        mkdir -p "$REBUCK2_WORK/lapdone"
        : > "$REBUCK2_WORK/lapdone/done"

    - if: always()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/rebuck2-driver/lapdone
        key: rebuck2-done-${{ github.run_id }}

    # The skeleton rides the manifest whole and must be atomic with the
    # row index that references it, so the container uploads first and
    # the manifest is gated on it - same rule as every other bank.
    - name: Bank the dice delta
      id: pack-dice
      if: always() && env.REBUCK2_DICE_SEED != ''
      shell: bash
      run: |
        set -euo pipefail
        BANK_WORK="$REBUCK2_WORK/bank-dice" \
          rebuck2 bank dice-publish "$REBUCK2_DICE_DIR" "$REBUCK2_LINEAGE" \
            "$REBUCK2_DICE_SEED" "$GITHUB_RUN_ID" "$REBUCK2_PARENT_LINEAGE"

    - id: dice-container
      if: always() && steps.pack-dice.outputs.have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-dice-segs-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}
        path: ${{ runner.temp }}/rebuck2-driver/bank-dice/dice-container
        compression-level: 0

    - if: always() && steps.pack-dice.outputs.have == '1' && steps.dice-container.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ env.REBUCK2_LINEAGE }}-dice-${{ env.REBUCK2_DICE_SEED8 }}
        path: ${{ runner.temp }}/rebuck2-driver/bank-dice/dice-manifest-out

    - name: Bank what the driver authored
      id: pack-driver
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        BANK_WORK="$REBUCK2_WORK/bank-driver" \
          rebuck2 bank publish "$REBUCK2_STORE/driver" driver - \
            "$REBUCK2_LINEAGE" "$GITHUB_RUN_ID" "$REBUCK2_PARENT_LINEAGE"

    - id: cas-container-driver
      if: always() && steps.pack-driver.outputs.have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-segs-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}-driver
        path: ${{ runner.temp }}/rebuck2-driver/bank-driver/bank-container
        compression-level: 0

    - if: always() && steps.pack-driver.outputs.spill == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-spill-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}-driver
        path: ${{ runner.temp }}/rebuck2-driver/bank-driver/bank-spill
        compression-level: 0

    - id: ac-container-driver
      if: always() && steps.pack-driver.outputs.ac-have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-ac-segs-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}-driver
        path: ${{ runner.temp }}/rebuck2-driver/bank-driver/ac-container
        compression-level: 0

    - if: always() && steps.pack-driver.outputs.ac-have == '1' && steps.ac-container-driver.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ env.REBUCK2_LINEAGE }}-ac-driver
        path: ${{ runner.temp }}/rebuck2-driver/bank-driver/ac-manifest-out

    - name: Bank what the co-worker authored
      id: pack-coworker
      if: always() && env.REBUCK2_COWORKER == '1'
      shell: bash
      run: |
        set -euo pipefail
        BANK_WORK="$REBUCK2_WORK/bank-co-worker" \
          rebuck2 bank publish "$REBUCK2_STORE/co-worker" co-worker - \
            "$REBUCK2_LINEAGE" "$GITHUB_RUN_ID" "$REBUCK2_PARENT_LINEAGE"

    - id: cas-container-coworker
      if: always() && steps.pack-coworker.outputs.have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-segs-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}-co-worker
        path: ${{ runner.temp }}/rebuck2-driver/bank-co-worker/bank-container
        compression-level: 0

    - if: always() && steps.pack-coworker.outputs.spill == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-spill-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}-co-worker
        path: ${{ runner.temp }}/rebuck2-driver/bank-co-worker/bank-spill
        compression-level: 0

    - id: ac-container-coworker
      if: always() && steps.pack-coworker.outputs.ac-have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-ac-segs-${{ env.REBUCK2_LINEAGE }}-${{ github.run_id }}-co-worker
        path: ${{ runner.temp }}/rebuck2-driver/bank-co-worker/ac-container
        compression-level: 0

    - if: always() && steps.pack-coworker.outputs.ac-have == '1' && steps.ac-container-coworker.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ env.REBUCK2_LINEAGE }}-ac-co-worker
        path: ${{ runner.temp }}/rebuck2-driver/bank-co-worker/ac-manifest-out

    # The driver's accumulated hot metadata: CAS blobs <= 256KB, which is
    # rmetas and dirs argsfiles, never the MB-scale rlibs that live on
    # worker shards. -4 and no --long deliberately: this ran 435s at
    # -8/--long=27 every lap (run 29564589011) for a marginal ratio gain
    # on tiny files, and the seed side reads both formats.
    - name: Pack the driver hot-CAS
      id: hotpack
      if: always() && env.REBUCK2_HOT_CAS == 'true'
      shell: bash
      run: |
        set -euo pipefail
        [ -d "$REBUCK2_STORE/driver/cas" ] || { echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
        mkdir -p "$REBUCK2_WORK/hotcas"
        ( cd "$REBUCK2_STORE/driver" \
          && find cas -type f -size -262144c -print0 | tar --null -c -T - ) \
          | zstd -T0 -4 > "$REBUCK2_WORK/hotcas/hotcas.tar.zst"
        ls -lh "$REBUCK2_WORK/hotcas/" || true

    - if: always() && env.REBUCK2_HOT_CAS == 'true' && steps.hotpack.outputs.skip != '1'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/rebuck2-driver/hotcas
        key: rebuck2-hotcas-${{ github.run_id }}

    - name: Dispatch stats
      if: always()
      shell: bash
      run: |
        kill -0 "$(cat "$REBUCK2_DRIVER_PID_FILE")" 2>/dev/null \
          || echo "*** DRIVER PROCESS DIED - check the driver log tail below ***"
        echo "jobs dispatched: $(grep -c -- '-> worker ' "$REBUCK2_DRIVER_LOG" || true)"
        # Silent-cache-regression tripwire: an AC was seeded but served
        # nothing. Green + fast-ish laps hid exactly this once (the shard
        # zips clobbered the AC tar); hit-rates are the only witness.
        # || true: a lap can finish inside the first 30s heartbeat interval
        # (fully-warm builds) - an empty log is not an error here.
        hb=$(grep -a "\[stats\]" "$REBUCK2_DRIVER_LOG" | tail -1 || true)
        hits=$(printf '%s' "$hb" | sed -n 's/.*grpc\[ac \([0-9]*\)\/.*/\1/p')
        misses=$(printf '%s' "$hb" | sed -n 's/.*grpc\[ac [0-9]*\/\([0-9]*\)\/.*/\1/p')
        if [ "${REBUCK2_SEEDED_AC_COUNT:-0}" -gt 0 ] && [ "${hits:-0}" -eq 0 ] && [ "${misses:-0}" -gt 0 ]; then
          echo "::warning::rebuck2: $REBUCK2_SEEDED_AC_COUNT AC entries were seeded but served ZERO hits ($misses misses) - the cache is silently cold; check the seed path"
        fi
        grep -o -- '-> worker [0-9]*' "$REBUCK2_DRIVER_LOG" | sort | uniq -c || true
        grep -a "\[stats\]" "$REBUCK2_DRIVER_LOG" | tail -2 || true
        tail -5 "$REBUCK2_DRIVER_LOG"


    - name: Upload driver log
      if: always() && inputs.log-artifact != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.log-artifact }}
        path: |
          ${{ runner.temp }}/rebuck2-driver/driver.log
          ${{ runner.temp }}/rebuck2-driver/co-worker.log
        if-no-files-found: ignore
