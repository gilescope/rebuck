name: rebuck2 setup
description: >-
  Install the rebuck2 binary, cached in the actions cache keyed by rebuck
  commit. Defaults to the same commit this action is pinned at, so one
  `@sha` pins engine and choreography together. Requires a rust toolchain
  on PATH for the cache-miss cargo install (pair with dtolnay/rust-toolchain).

inputs:
  rebuck2-git:
    description: Git URL of the rebuck repo to install from.
    default: https://github.com/gilescope/rebuck
  rev:
    description: >-
      Exact commit to install. Empty = the ref this action was pinned at
      (github.action_ref) - pin the action by full sha for that to work.
    default: ""
  branch:
    description: >-
      Branch to resolve at run time instead of a pinned rev. Floats - warm
      binary caches invalidate on every push. Prefer `rev`.
    default: ""

outputs:
  rev:
    description: The commit that was installed.
    value: ${{ steps.resolve.outputs.rev }}

runs:
  using: composite
  steps:
    - name: Resolve rebuck2 rev
      id: resolve
      shell: bash
      env:
        IN_REV: ${{ inputs.rev }}
        IN_BRANCH: ${{ inputs.branch }}
        ACTION_REF: ${{ github.action_ref }}
        REBUCK2_GIT: ${{ inputs.rebuck2-git }}
      run: |
        REV="$IN_REV"
        if [ -z "$REV" ] && [ -n "$IN_BRANCH" ]; then
          REV=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$IN_BRANCH" | cut -f1)
          [ -n "$REV" ] || { echo "branch $IN_BRANCH not found on $REBUCK2_GIT"; exit 1; }
        fi
        REV="${REV:-$ACTION_REF}"
        case "$REV" in
          [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
          *) echo "rev '$REV' is not a sha - pin the action by full sha or pass rev/branch"; exit 1 ;;
        esac
        echo "rev=$REV" >> "$GITHUB_OUTPUT"

    - name: Cache rebuck2 binary (keyed by rebuck commit)
      id: bin
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/rebuck2
          ~/.cargo/bin/rebuck2.exe
        key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.rev }}

    - name: Install rebuck2 (cache miss only)
      if: steps.bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        REBUCK2_GIT: ${{ inputs.rebuck2-git }}
        REBUCK2_REV: ${{ steps.resolve.outputs.rev }}
      run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2
