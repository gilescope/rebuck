name: rebuck2 bank publish
description: >-
  Bank this node's new content and upload it: CAS blobs for the range it
  owns, action-cache rows it authored, and a spill of everything else for
  the range owners to absorb. Includes the artifact uploads, so a consumer
  writes one `uses:` rather than five gated steps.

inputs:
  store:
    description: Store root. Defaults to the same resolution bank-restore uses.
    required: false
    default: ""
  subdir:
    description: >-
      Sub-store under the resolved root, e.g. "worker" or "driver". One
      runner can host several roles (the driver box also runs a
      co-worker), and each needs its own store - but the ROOT is the
      action's business, not the caller's.
    required: false
    default: ""
  role:
    description: >-
      This node's identity in the bank. Names its own AC manifest and its
      spill artifact, so it must match the role given to bank-restore.
    required: true
  shard:
    description: >-
      The CAS range this node is PRIMARY manifest writer for (0-7), or "-"
      for spill-only. One writer per range IS the work split - a second
      writer would race the manifest.
    required: false
    default: "-"
  lineage:
    description: 'Bank lineage. Defaults to the branch (PR: the source branch).'
    required: false
    default: ""
  parent-lineage:
    description: Trunk this lineage inherits from. Defaults to the PR base branch.
    required: false
    default: ""
  ac:
    description: >-
      Also bank the action-cache rows this node authored. Every node that
      executes actions should: the row and the blobs it references are then
      banked by the same node in the same teardown, so a torn publish loses
      both together rather than banking a row whose outputs never landed.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - id: pack
      shell: bash
      env:
        CAS_LINEAGE: ${{ inputs.lineage || github.head_ref || github.ref_name }}
        CAS_PARENT_LINEAGE: ${{ inputs.parent-lineage || github.base_ref }}
      run: |
        set -euo pipefail
        STORE='${{ inputs.store }}'
        if [ -z "$STORE" ]; then
          if [ -n "${DEV_DRIVE:-}" ]; then STORE="$DEV_DRIVE/rebuck2"
          else STORE="$HOME/.cache/rebuck2"; fi
        fi
        SUB='${{ inputs.subdir }}'
        [ -z "$SUB" ] || STORE="$STORE/$SUB"
        BANK_WORK="${BANK_WORK:-$RUNNER_TEMP/rebuck2-bank}"
        export BANK_WORK
        echo "bank-work=$BANK_WORK" >> "$GITHUB_OUTPUT"
        echo "lineage=$CAS_LINEAGE" >> "$GITHUB_OUTPUT"

        rebuck2 bank cas-publish "$STORE" '${{ inputs.role }}' \
          '${{ inputs.shard }}' "$CAS_LINEAGE" "$GITHUB_RUN_ID" \
          "${CAS_PARENT_LINEAGE:--}"
        if [ '${{ inputs.ac }}' = 'true' ]; then
          rebuck2 bank ac-publish "$STORE" '${{ inputs.role }}' \
            "$CAS_LINEAGE" "$GITHUB_RUN_ID" "${CAS_PARENT_LINEAGE:--}"
        fi

    # Self-verification is step ORDER, not a checker: each manifest upload
    # is gated on the container upload that precedes it succeeding, so a
    # manifest can never reference a container that did not land. A death
    # anywhere in here leaves the previous generation as HEAD - stale by
    # one lap, self-healing, and no other range is affected.
    - id: cas-container
      if: always() && steps.pack.outputs.have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-segs-${{ steps.pack.outputs.lineage }}-${{ github.run_id }}-${{ inputs.role }}
        path: ${{ steps.pack.outputs.bank-work }}/bank-container
        compression-level: 0

    - if: always() && steps.pack.outputs.manifest == '1' && steps.cas-container.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ steps.pack.outputs.lineage }}-r${{ inputs.shard }}
        path: ${{ steps.pack.outputs.bank-work }}/bank-manifest-out

    # Spill needs no gate: nothing references it by name. A range owner
    # absorbs it on a later restore, where the ordinary diff banks it.
    - if: always() && steps.pack.outputs.spill == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-spill-${{ steps.pack.outputs.lineage }}-${{ github.run_id }}-${{ inputs.role }}
        path: ${{ steps.pack.outputs.bank-work }}/bank-spill
        compression-level: 0

    - id: ac-container
      if: always() && steps.pack.outputs.ac-have == '1'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-ac-segs-${{ steps.pack.outputs.lineage }}-${{ github.run_id }}-${{ inputs.role }}
        path: ${{ steps.pack.outputs.bank-work }}/ac-container
        compression-level: 0

    - if: always() && steps.pack.outputs.ac-have == '1' && steps.ac-container.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cas-manifest-${{ steps.pack.outputs.lineage }}-ac-${{ inputs.role }}
        path: ${{ steps.pack.outputs.bank-work }}/ac-manifest-out
