[package]
name = "buildkit-session"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Serve BuildKit session attachables (secrets, auth, ssh) to a daemon you do not own"

[dependencies]
anyhow = "1"
bollard-buildkit-proto = "0.8"
bytes = "1"
futures = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt", "io-util", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tonic = "0.14"
tower = "0.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
