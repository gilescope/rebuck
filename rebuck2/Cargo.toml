[package]
name = "rebuck2"
version = "0.0.0"
edition = "2021"
description = "Ad-hoc distributed Remote Execution for buck2 on GitHub Actions, over iroh P2P"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bazel-remote-apis = "0.27"
# BuildKit's LLB wire types (pb::Op / ExecOp / Definition). The buildkit-
# facing side of the fleet has to read what a subtree IS before deciding
# whether it may travel. This crate rides bollard, tracks buildkit, and is
# on the same prost/tonic 0.14 as everything else here - buildkit-proto,
# the other candidate, has not moved since 2020.
bollard-buildkit-proto = "0.8"
futures = "0.3"
iroh = "1"
postcard = { version = "1", features = ["use-std"] }
prost = "0.14"
# Already compiled as a transitive dep (tonic/iroh) - promoting it to a
# direct one costs a line, not a build. rustls only: no OpenSSL on the
# windows runners.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "charset", "http2"] }
reflink-copy = "0.1.30"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
# GitHub wraps every artifact in a zip, whatever we put inside it.
zip = { version = "6", default-features = false, features = ["deflate"] }

[[bin]]
name = "rebuck2"
path = "src/main.rs"
