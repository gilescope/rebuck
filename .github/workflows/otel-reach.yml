# Can a GitHub runner reach the collector at all?
#
# Asked because the box's public address is the ROUTER's: the machine itself
# only holds 192.168.1.137, so anything from outside needs a forward that a
# NixOS firewall rule cannot supply. Testing from a LAN machine proves
# nothing either way - most routers do not hairpin - so ask a runner.
name: otel reachability  # probe: rule activated
on:
  # A push trigger as well as dispatch: workflow_dispatch only lists
  # workflows present on the DEFAULT branch, and this one lives on a
  # feature branch.
  push:
    branches: [giles-dispatch]
    paths: ['.github/workflows/otel-reach.yml']
  workflow_dispatch:
    inputs:
      host:
        description: public address to probe
        type: string
        default: 81.2.89.216
      ports:
        description: space-separated ports to try
        type: string
        default: 22 80 443 4317 4318

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: which ports reach the box
        env:
          TOKEN: ${{ secrets.OTLP_TOKEN }}
          HOST: ${{ inputs.host || '81.2.89.216' }}
          PORTS: ${{ inputs.ports || '22 80 443 4317 4318' }}
        run: |
          set -uo pipefail
          # A TCP connect says the router forwards the port. The OTLP POST
          # then says whether what answers is our collector: 200 accepted,
          # 401 reachable but the token is wrong, anything else is some other
          # service on a port that happens to be open.
          # 22 is the DISCRIMINATOR. It is forwarded (to .129) and ISPs do
          # not usually block it, unlike 80 and 443 which residential lines
          # very often do. If 22 answers, forwarding works and the WAN
          # address is right, so a new rule for the collector will work too.
          # If 22 is closed as well, this is CGNAT and no rule can help.
          for p in $PORTS; do
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/$p" 2>/dev/null; then
              code=$(curl -sk -o /dev/null -m 12 -w '%{http_code}' \
                -X POST "https://$HOST:$p/v1/traces" \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"resourceSpans":[]}' || true)
              echo "port $p: OPEN, otlp says $code"
            else
              echo "port $p: closed"
            fi
          done
