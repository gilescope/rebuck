name: selftest

# Proves the action's full GHA lifecycle on a real runner: job `populate` builds
# the tiny test/ buck2 project cold (compiles locally + uploads to the
# bazel-remote sidecar, whose dir is saved to actions/cache in post). Job
# `verify` (needs populate) restores that cache, starts its own sidecar, and the
# build must be served from cache — proving cross-run reuse, the whole point.

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch. Six jobs fire on every push, and a busy branch queues
# them behind each other until the account's 20-job cap is reached - which
# today meant a fleet experiment waiting on selftests for commits that had
# already been superseded twice. An older run of the same branch tells you
# nothing a newer one does not.
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The engine itself. Nothing else in CI compiles rebuck2 on a PR - the jobs
  # below prove the action's GHA lifecycle, not the Rust - so without this a
  # broken engine merges green.
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rebuck2
      - name: fmt
        working-directory: rebuck2
        run: cargo fmt --all --check
      - name: clippy
        working-directory: rebuck2
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: rebuck2
        run: cargo test --locked

  # The cache-mount harvest, against a real daemon, in five minutes.
  #
  # Four separate faults have stopped a seeding run in the multi-runner
  # workflow - a binary path from the wrong job's layout, a bare digest that
  # is not a reference, a cache id nobody had read off a real run, and a
  # missing URL scheme - and every one cost a twenty-five minute run to
  # find, because nothing exercises `harvest-cache` except a run.
  #
  # An EMPTY cache is enough. The mechanism being smoke-tested is the path -
  # dial the daemon, solve a graph with a cache mount and a scratch output,
  # export it, turn the digest into something pullable - and none of that
  # cares whether the cache had anything in it. Two of the four faults would
  # have died here in seconds.
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rebuck2
      - name: build
        working-directory: rebuck2
        run: cargo build --release --locked
      - name: a daemon and a registry
        run: |
          set -euo pipefail
          # Same pinned image as the fleet workflow: a smoke test against a
          # different buildkit is a smoke test of a different thing.
          # THE DAEMON HAS TO BE TOLD, and this is the other half of a
          # distinction the fleet workflow already documents: publishing is
          # made insecure per-solve, so a push to a plain-HTTP registry
          # works with no config at all - but PULLING is governed by daemon
          # config alone. The harvest pulls its base, so it needs the file,
          # and without it buildkit reports
          #
          #   http: server gave HTTP response to HTTPS client
          #
          # having silently tried https:// first.
          mkdir -p bkcfg
          # printf, not a heredoc: the terminator would have to sit at column
          # zero to end one, and an indented `TOML` simply does not - the
          # heredoc would swallow the rest of the step.
          printf '[registry."172.17.0.1:15000"]\n  http = true\n  insecure = true\n' \
            > bkcfg/buildkitd.toml
          docker run -d --name smoke-bk --privileged -p 28372:8372 \
            -v "$PWD/bkcfg:/etc/buildkit:ro" \
            -e BUILDKIT_TCP_TRANSPORT_ENABLED=true -e BUILDKIT_TLS_ENABLED=false \
            earthbuild/buildkitd:v0.8.17 >/dev/null
          # PULL-THROUGH ON. A sessionless solve cannot reach Docker Hub -
          # buildkit asks the session for credentials even for an anonymous
          # pull and answers `failed to load cache key: no active sessions` -
          # and this project already has that finding written down under "a
          # sessionless peer cannot reach Docker Hub". Our own registry does
          # the token dance itself, over plain HTTP the daemon needs no
          # session for.
          REBUCK_UPSTREAM_REGISTRY=1 \
          ./rebuck2/target/release/rebuck2 registry --bind 0.0.0.0:15000 \
            > registry.log 2>&1 &
          for _ in $(seq 1 90); do
            docker exec smoke-bk buildctl --addr tcp://127.0.0.1:8372 debug workers \
              >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec smoke-bk buildctl --addr tcp://127.0.0.1:8372 debug workers >/dev/null
      - name: harvest an empty cache mount
        run: |
          set -euo pipefail
          # NO SCHEME on --bk, deliberately. That is exactly how the fleet
          # workflow calls it and exactly what died on `invalid URL, scheme
          # is missing`; writing http:// here would test the fixed spelling
          # rather than the one in use.
          ./rebuck2/target/release/rebuck2 harvest-cache \
            --bk 172.17.0.1:28372 --registry 172.17.0.1:15000 \
            --base 172.17.0.1:15000/library/busybox:1 \
            --id smoke-cache --dest /smoke/cache | tee harvest.out
          line=$(grep -oE '^REBUCK2_CACHE_SEEDS=.*' harvest.out)
          echo "harvested: $line"
          # A REFERENCE, not a digest. `docker-image://sha256:...` parses
          # nowhere, and the seeding path built exactly that for a commit.
          case "$line" in
            REBUCK2_CACHE_SEEDS=smoke-cache=172.17.0.1:15000/rebuck2/subtree@sha256:*) ;;
            *) echo "::error::not a pullable reference: $line"; exit 1 ;;
          esac
      - name: what it left behind
        if: always()
        run: |
          echo "=== registry"; tail -20 registry.log || true
          echo "=== daemon"; docker logs --tail 20 smoke-bk 2>&1 || true

  populate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write          # rebuck saves the cache
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gilescope/install-buck2@79ce03d0602320942c0a39bdf1c754fe19a85703 # latest
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
      - uses: ./
        with:
          buck-root: test
          cache-key-prefix: rebuck-selftest-${{ github.run_id }}
      - name: cold build (populate)
        working-directory: test
        run: buck2 build //... 2>&1 | tee build.log
      - name: assert cold run compiled locally
        working-directory: test
        run: |
          grep -E 'local: [1-9]' build.log || { echo "expected local compiles on a cold run"; exit 1; }

  verify:
    needs: populate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gilescope/install-buck2@79ce03d0602320942c0a39bdf1c754fe19a85703 # latest
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
      - uses: ./
        with:
          buck-root: test
          cache-key-prefix: rebuck-selftest-${{ github.run_id }}
      - name: warm build (from restored cache)
        working-directory: test
        run: buck2 build //... 2>&1 | tee build.log
      - name: assert warm run hit the cache
        working-directory: test
        run: |
          cat build.log
          grep -E 'Cache hits: 100%|cached: [1-9]' build.log \
            || { echo "FAIL: warm run did not hit the rebuck cache"; exit 1; }
          if grep -qE 'local: [1-9]' build.log; then
            echo "WARN: some actions still ran locally on the warm run"
          fi
